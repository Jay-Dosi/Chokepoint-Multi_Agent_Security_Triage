[project]
name = "chokepoint-backend"
version = "1.0.0"
description = "Attack-path triage over FalkorDB: API, MCP server, agents and evaluation."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_server"]

[tool.ruff.format]
quote-style = "double"
